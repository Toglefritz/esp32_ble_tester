[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino

; Serial monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for M5 Stack ATOM Matrix
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_ATOM
    ; Uncomment the line below to enable dynamic pairing method testing
    ; This adds a characteristic that cycles through different pairing methods
    ; on each disconnect: Just Works -> Numeric Comparison -> Passkey Entry
     -DENABLE_DYNAMIC_PAIRING_TEST

; Library dependencies
lib_deps = 
    m5stack/M5Atom@^0.1.0
    fastled/FastLED@^3.6.0

; Upload configuration
upload_speed = 1500000